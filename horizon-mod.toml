id = "rftoolsutility"
name = "RFTools Utility"
version = "0.2.16"
description = """A port of RFTools Utility for Horizon: the tank, a 32,000 mB fluid tank that holds
one fluid at a time, takes and gives a bucket on a right click, exposes the fluid
capability on every face and shows its fill level through the jar's own nine textures;
the crafter in its three tiers, a 50,000 FE crafting machine that runs 2, 4 or 8 taught
3x3 recipes from its buffer, chains one recipe's result into the next, and takes
automation on every face; the spawner, which spawns the mob its carried spawner
recipe names on the block's facing side for that recipe's own RF cost and its three
matter amounts, out of a 200,000 FE buffer and three matter stores; and the matter beamer,
which carries that recipe's own materials into the store each one feeds, 2,000 FE a block
through a wrench-linked spawner; and the matter transmitter, receiver and booster, which
teleport a player standing in the transmitter's beam to the dialed receiver's coordinate, across
dimensions, charging the trip's RF over its ticks and interrupting on a power failure or a player
leaving the beam; and the passive destination analyzer, which lets a dialed transmitter check its
receiver's readiness (two clear blocks and 5,000 FE) every 20 ticks and report it as a signal
strength; the sensor, which checks the block on its input side every ten ticks and emits a
real 15/0 redstone signal beside it; the sequencer, whose seven-mode state machine pulses a
64-bit pattern from rising edges of an input signal into the same real 15/0 redstone output; and
the timer, whose rising-edge-reloaded countdown emits a one-tick 15 pulse every delay ticks (held
while the input stays high when pauses is set) through that same redstone output; the counter, which
latches 15 when a rising edge count reaches its limit and clears on the next edge; and the analog,
which compares two side inputs and emits the artefact's multiply-and-offset arithmetic clamped to
0..15 as a real redstone strength; and the logic gate, which combines its left, input and right
side signals into one 15/0 output through a jar-derived eight-cell truth table (`-1` keeps the
previous output), written by `/rftoolsutility logic-set` in place of the GUI; and the inventory
checker, which reads the live item slots of the neighbour on its input side every ten ticks and
emits 15 when the configured slot holds at least the configured count of a matching item (the
matcher, damage mode, tag and input side are written by `/rftoolsutility invchecker-set` in place
of the GUI). The display-only digit is not ported: upstream has no redstone output, only a client
sprite renderer."""
authors = ["McJty", "Horizon native mod contributors"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside the carried data/ and assets/. The id is the resource namespace and the only identity:
# Cargo's package name and version are not the mod's.
api = "0.2"
# The installation side, not the hook's: an integrated server belongs to the client
# installation, so a single-player world and a LAN host need both.
side = "both"
# registries: "May add blocks, items, mob effects and entity types to your worlds" — the tank's,
# the crafter's and the spawner's blocks and items are carried content, and the code declares
# their block entity types and the spawner's recipe serializer.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
