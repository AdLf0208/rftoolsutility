[package]
# Port of RFTools Utility 1.21-7.0.13 (McJtyMods/RFToolsUtility, MIT). Minecraft Java
# 1.21.1 NeoForge; the port targets Horizon 26.3 at the pin in horizon-mod.toml.
# Clean-room Rust rewrite from the mod's behaviour (FINDINGS.md); local-only until
# publishing is approved, publishable under MIT with this source.
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "rftoolsutility"
version = "0.2.12"
edition = "2024"
license = "MIT"
description = "RFTools Utility for Horizon: the tank, the crafter tiers, the spawner, the matter beamer, the teleporter family, the sensor, the sequencer and the timer"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build). Any other registry dependency must be
# pinned with `horizon-launcher native-lock .` before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
